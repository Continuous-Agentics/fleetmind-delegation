name: Release delegation-core

on:
  push:
    tags:
      - "delegation-core-v*"

permissions: {}

jobs:
  release:
    name: Create draft GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'ggettert' || github.actor == 'wren-on-ca[bot]'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Publishing this draft as Grace is the deliberate release gate.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
